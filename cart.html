<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - KaranShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">Karan<span>Shop</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html" class="active">Cart <span id="cart-count">0</span></a>
        <a href="login.html">Login</a>
    </nav>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<section class="page-header">
    <p>YOUR SHOPPING BAG</p>
    <h1>Shopping Cart</h1>
</section>

<section class="cart-section">

    <div id="cart-items"></div>

    <div class="cart-summary">
        <h2>Order Summary</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <strong id="subtotal">₹0</strong>
        </div>

        <div class="summary-row">
            <span>Delivery</span>
            <strong>FREE</strong>
        </div>

        <hr>

        <div class="summary-row total">
            <span>Total</span>
            <strong id="total">₹0</strong>
        </div>

        <a href="checkout.html" class="btn checkout-btn">
            Proceed to Checkout
        </a>
    </div>

</section>

<footer>
    <div class="copyright">
        © 2026 KaranShop. All Rights Reserved.
    </div>
</footer>

<script src="js/script.js"></script>

</body>
</html>
